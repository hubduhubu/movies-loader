name: Simple Pipe
on:
    push:
        branches: dev

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: upload artifact
              uses: actions/upload-artifact@v4
              with: 
                name: movies.json
                path: movies.json
                if-no-files-found: error
                retention-days: 1 